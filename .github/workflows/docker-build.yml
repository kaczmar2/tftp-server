name: Docker Build, Test and Publish

# Builds and tests every push. Publishes in exactly two cases, decided by the
# "Decide whether to publish" step below:
#
#   1. You push a v* tag. The published version is the tag you chose, so major
#      and minor releases stay under your control.
#   2. Renovate merges a base image digest bump into main. The patch segment is
#      incremented and the release happens unattended.
#
# Everything else builds and tests only. In particular, your own pushes to main
# never publish, even when they touch the Dockerfile, so a code change plus a
# tag of your choosing produces one release rather than two.
#
# Build, publish, and tag are one job on purpose. A tag pushed with GITHUB_TOKEN
# does not start another workflow, so publishing cannot wait for the tag event.
# Sharing a job also keeps the buildx cache warm, so the image published is the
# one just tested.
on:
  push:
    branches: [ "*" ]
    tags:
      - v*
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Full history and tags: the version calculation needs the most recent
        # release tag, and the Dockerfile check compares against the previous
        # commit.
        fetch-depth: 0

    - name: Decide whether to publish
      id: decide
      env:
        REF: ${{ github.ref }}
        EVENT: ${{ github.event_name }}
      run: |
        # Read the author from git, not from the event payload. This is
        # verifiable locally, and it does not depend on how GitHub populates
        # payload fields for bot commits.
        AUTHOR=$(git log -1 --format='%an')

        PUBLISH=false
        CREATE_TAG=false
        VERSION=""

        if [ "$EVENT" = "push" ] && [ "${REF#refs/tags/v}" != "$REF" ]; then
          # You pushed a version tag. Publish exactly what you named.
          VERSION="${REF#refs/tags/v}"
          PUBLISH=true
          echo "Tag push by you. Publishing version $VERSION, tag already exists."

        elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ] && [ "$AUTHOR" = "renovate[bot]" ]; then
          # Renovate merged something. Only a base image change is a release:
          # it also automerges GitHub Actions updates, which must not publish.
          if git diff --name-only HEAD~1 HEAD | grep -qx 'Dockerfile'; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
            NUM="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$NUM"
            VERSION="${MAJOR:-1}.${MINOR:-0}.$(( ${PATCH:-0} + 1 ))"
            PUBLISH=true
            CREATE_TAG=true
            echo "Renovate changed the Dockerfile. $LATEST_TAG -> v$VERSION, tag will be created."
          else
            echo "Renovate commit, but the Dockerfile is unchanged. Build and test only."
          fi

        else
          echo "Not a release trigger. Build and test only."
        fi

        echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
        echo "create_tag=$CREATE_TAG" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        {
          echo "### Release decision"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| event | \`$EVENT\` |"
          echo "| ref | \`$REF\` |"
          echo "| commit author | \`${AUTHOR:-n/a}\` |"
          echo "| publish | \`$PUBLISH\` |"
          echo "| version | \`${VERSION:-n/a}\` |"
          echo "| create tag | \`$CREATE_TAG\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    # No setup-qemu-action here on purpose. The docker-container driver runs
    # builds inside moby/buildkit, which ships its own emulators
    # (buildkit-qemu-aarch64, buildkit-qemu-arm, ...), so cross-architecture
    # builds do not need binfmt handlers on the host. The "Build all published
    # platforms" step below is what protects us: if emulation ever breaks, it
    # fails on the next push rather than at publish time.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Install TFTP client
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq tftp-hpa
      
    # Build every platform we publish, so a break on arm64 or arm/v7 shows up
    # here instead of at publish time. The functional tests below need a
    # loadable image, and `load: true` only works for a single platform, so
    # this step only checks that the build succeeds.
    - name: Build all published platforms
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: false

    - name: Build Docker image (single platform for testing)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: false
        tags: tftp-server:test
        load: true
        
    - name: Set up TFTP test environment
      run: |
        # Set up Docker bind mounts
        sudo mkdir -p /srv/docker/tftp /srv/docker/www
        sudo chown -R $USER:$USER /srv/docker
        sudo chmod -R 755 /srv/docker/tftp /srv/docker/www
        
    - name: Test TFTP-only mode
      run: |
        # Start container in TFTP-only mode
        docker run -d \
          --name tftp-test \
          --network host \
          -e TZ=America/Denver \
          -e ENABLE_WEBSERVER=false \
          -v /srv/docker/tftp:/srv/tftp \
          tftp-server:test
          
        # Wait for startup
        sleep 3
        
        # Check if container is running
        docker ps | grep tftp-test
        
        # Check logs for startup message
        docker logs tftp-test | grep "Starting TFTP server"
        docker logs tftp-test | grep "TFTP only mode"
        
    - name: Test TFTP functionality
      run: |
        # Test TFTP download
        cd /tmp
        uname -a | sudo tee /srv/docker/tftp/test
        echo "get test" | tftp localhost
        
        # Verify file was downloaded and content matches
        if [ -f test ]; then
          echo "✅ File downloaded successfully"
          if diff test /srv/docker/tftp/test; then
            echo "✅ File content matches"
          else
            echo "❌ File content differs"
            echo "Downloaded file:"
            cat test
            echo "Original file:"
            cat /srv/docker/tftp/test
            exit 1
          fi
        else
          echo "❌ File was not downloaded"
          exit 1
        fi
        
        # Check TFTP logs for request
        docker logs tftp-test | grep "RRQ from"
        
    - name: Test TFTP upload functionality
      run: |
        # Stop existing container
        docker stop tftp-test || true
        docker rm tftp-test || true
        
        # Set permissions for upload testing
        sudo chmod -R 777 /srv/docker/tftp
        
        # Start container with upload capability (--create flag)
        docker run -d \
          --name tftp-test \
          --network host \
          -e TZ=America/Denver \
          -e ENABLE_WEBSERVER=false \
          -e TFTP_ARGS="--foreground --secure --create --verbosity 4 --user nobody" \
          -v /srv/docker/tftp:/srv/tftp \
          tftp-server:test
          
        # Wait for startup
        sleep 3
        
        # Test file upload
        cd /tmp
        echo "upload test content" > upload-test.txt
        tftp localhost <<'EOF'
        binary
        put upload-test.txt
        quit
        EOF
        
        # Verify uploaded file exists and has correct content
        if [ -f /srv/docker/tftp/upload-test.txt ]; then
          echo "✅ File uploaded successfully"
          if diff upload-test.txt /srv/docker/tftp/upload-test.txt; then
            echo "✅ Uploaded file content matches"
          else
            echo "❌ Uploaded file content differs"
            echo "Original file:"
            cat upload-test.txt
            echo "Uploaded file:"
            cat /srv/docker/tftp/upload-test.txt
            exit 1
          fi
        else
          echo "❌ File was not uploaded"
          exit 1
        fi
        
        # Check TFTP logs for upload request
        docker logs tftp-test | grep "WRQ from"

    - name: Test web server functionality
      run: |
        # Stop existing container
        docker stop tftp-test || true
        docker rm tftp-test || true
        
        # Start container with web server enabled
        docker run -d \
          --name tftp-test-web \
          --network host \
          -e TZ=America/Denver \
          -e ENABLE_WEBSERVER=true \
          -v /srv/docker/tftp:/srv/tftp \
          -v /srv/docker/www:/srv/www \
          tftp-server:test
          
        # Wait for startup
        sleep 3
        
        # Check logs for web server startup message
        docker logs tftp-test-web | grep "Starting BusyBox httpd"
        docker logs tftp-test-web | grep "Web server enabled"
        
        # Create test HTML and text files in web directory
        echo "<h1>Test Page</h1><p>TFTP Boot Server</p>" | sudo tee /srv/docker/www/index.html
        echo "Web server test content" | sudo tee /srv/docker/www/web-test.txt
        
        # Test web access to index
        sleep 2
        curl -f http://localhost/ | grep "Test Page"
        
        # Test file download via HTTP
        curl -f http://localhost/web-test.txt -o /tmp/web-test
        if diff /tmp/web-test /srv/docker/www/web-test.txt; then
          echo "✅ Web server file access works"
        else
          echo "❌ Web server file access failed"
          exit 1
        fi
        
    - name: Cleanup
      if: always()
      run: |
        docker stop tftp-test tftp-test-web || true
        docker rm tftp-test tftp-test-web || true
        rm -f /tmp/test /tmp/upload-test.txt /tmp/web-test
        sudo rm -f /srv/docker/www/index.html /srv/docker/www/web-test.txt

    - name: Login to Docker Hub
      if: steps.decide.outputs.publish == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      if: steps.decide.outputs.publish == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # DOCKER_METADATA_ANNOTATIONS_LEVELS is needed because metadata-action
    # annotates the per-platform manifests only by default. The GHCR package
    # page reads the index, so without "index" the published image carries no
    # index annotations at all.
    - name: Extract metadata
      if: steps.decide.outputs.publish == 'true'
      id: meta
      uses: docker/metadata-action@v6
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
      with:
        images: |
          ${{ github.repository_owner }}/tftp-server
          ghcr.io/${{ github.repository_owner }}/tftp-server
        tags: |
          type=semver,pattern={{version}},value=v${{ steps.decide.outputs.version }}

    - name: Build and push to registries
      id: push
      if: steps.decide.outputs.publish == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}

    # Reports what actually reached the registries, read back from the pushed
    # manifest rather than restated from config. Never fails the run: a release
    # that worked should not go red because a reporting call hiccuped.
    - name: Summarise the release
      if: steps.decide.outputs.publish == 'true'
      env:
        VERSION: ${{ steps.decide.outputs.version }}
        DIGEST: ${{ steps.push.outputs.digest }}
        OWNER: ${{ github.repository_owner }}
      run: |
        IMAGE="ghcr.io/$OWNER/tftp-server:$VERSION"
        PLATFORMS=$(docker buildx imagetools inspect "$IMAGE" 2>/dev/null \
          | awk '/^  Platform:/ {print $2}' | grep -v unknown | paste -sd', ' || true)
        {
          echo "### Published"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| version | \`$VERSION\` |"
          echo "| digest | \`$DIGEST\` |"
          echo "| platforms | ${PLATFORMS:-could not read manifest} |"
          echo "| Docker Hub | \`$OWNER/tftp-server:$VERSION\` |"
          echo "| GHCR | \`$IMAGE\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    # Only when the version was computed here. A tag you pushed already exists.
    # This runs after the push, so the images are live before the tag appears.
    - name: Create Git Tag
      if: steps.decide.outputs.create_tag == 'true'
      env:
        TAG: v${{ steps.decide.outputs.version }}
        COMMIT: ${{ github.sha }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "$TAG" -m "Automated release $TAG from base image update in $COMMIT"
        git push origin "$TAG"
