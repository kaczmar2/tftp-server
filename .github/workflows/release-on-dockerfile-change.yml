name: Release on Dockerfile Change

# Renovate watches the base image digest pinned in the Dockerfile. When it
# merges an update into main, the Dockerfile changes and this workflow builds,
# tests, publishes, and tags a new patch release. Renovate replaced the old
# daily cron job that compared digests by hand.
#
# Build, publish, and tag are deliberately in ONE job. The tag is pushed with
# GITHUB_TOKEN, and GitHub does not start workflows from events created by that
# token. A tag pushed here therefore never triggers docker-build.yml, so
# publishing must not depend on the tag event.

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-publish-tag:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Full history and tags, so the version calculation below can find the
        # most recent release tag.
        fetch-depth: 0

    - name: Calculate next version
      id: version
      run: |
        # Get the latest tag, or start with 1.0.0 if no tags exist
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
        echo "Latest tag: $LATEST_TAG"
        
        # Remove 'v' prefix if present
        VERSION=${LATEST_TAG#v}
        
        # Parse version components
        IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
        MAJOR=${VERSION_PARTS[0]:-1}
        MINOR=${VERSION_PARTS[1]:-0}
        PATCH=${VERSION_PARTS[2]:-0}
        
        # Increment patch version
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
        NEW_TAG="v$NEW_VERSION"
        
        echo "Preserving major.minor: $MAJOR.$MINOR"
        echo "Incrementing patch: $PATCH -> $NEW_PATCH"
        echo "New version: $NEW_VERSION"
        echo "New tag: $NEW_TAG"
        
        # Set outputs
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
        
    # GitHub runners no longer ship QEMU, so the arm64 and arm/v7 builds in
    # the publish step below fail without this. The emulator version is
    # intentionally not pinned, so we get upstream fixes.
    - name: Set up QEMU for cross-architecture builds
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Install TFTP client
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq tftp-hpa
        
    - name: Build Docker image (single platform for testing)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: false
        tags: tftp-server:release-test
        load: true
        
    - name: Set up TFTP test environment
      run: |
        # Set up Docker bind mount
        sudo mkdir -p /srv/docker/tftp
        sudo chown -R $USER:$USER /srv/docker
        sudo chmod -R 755 /srv/docker/tftp
        
    - name: Test image can start
      run: |
        # Start container in TFTP-only mode
        docker run -d \
          --name tftp-test \
          --network host \
          -e TZ=America/Denver \
          -e ENABLE_WEBSERVER=false \
          -v /srv/docker/tftp:/srv/tftp \
          tftp-server:release-test
          
        # Wait for startup
        sleep 3
        
        # Check if container is running
        docker ps | grep tftp-test
        
        # Check logs for startup message
        docker logs tftp-test | grep "Starting TFTP server with process supervisor"
        
    - name: Test TFTP functionality
      run: |
        # Change to temp directory for test
        cd /tmp
        
        # Test TFTP download
        uname -a | sudo tee /srv/docker/tftp/test
        echo "get test" | tftp localhost
        
        # Verify file was downloaded and content matches
        if [ -f test ]; then
          echo "✅ File downloaded successfully"
          if diff test /srv/docker/tftp/test; then
            echo "✅ File content matches"
          else
            echo "❌ File content differs"
            echo "Downloaded file:"
            cat test
            echo "Original file:"
            cat /srv/docker/tftp/test
            exit 1
          fi
        else
          echo "❌ File was not downloaded"
          exit 1
        fi
        
        # Check TFTP logs for request
        docker logs tftp-test | grep "RRQ from"
        
    - name: Test TFTP upload functionality
      run: |
        # Stop existing container
        docker stop tftp-test || true
        docker rm tftp-test || true
        
        # Set permissions for upload testing
        sudo chmod -R 777 /srv/docker/tftp
        
        # Start container with upload capability (--create flag)
        docker run -d \
          --name tftp-test \
          --network host \
          -e TZ=America/Denver \
          -e ENABLE_WEBSERVER=false \
          -e TFTP_ARGS="--foreground --secure --create --verbosity 4 --user nobody" \
          -v /srv/docker/tftp:/srv/tftp \
          tftp-server:release-test
          
        # Wait for startup
        sleep 3
        
        # Test file upload
        cd /tmp
        echo "upload test content" > upload-test.txt
        tftp localhost <<'EOF'
        binary
        put upload-test.txt
        quit
        EOF
        
        # Verify uploaded file exists and has correct content
        if [ -f /srv/docker/tftp/upload-test.txt ]; then
          echo "✅ File uploaded successfully"
          if diff upload-test.txt /srv/docker/tftp/upload-test.txt; then
            echo "✅ Uploaded file content matches"
          else
            echo "❌ Uploaded file content differs"
            echo "Original file:"
            cat upload-test.txt
            echo "Uploaded file:"
            cat /srv/docker/tftp/upload-test.txt
            exit 1
          fi
        else
          echo "❌ File was not uploaded"
          exit 1
        fi
        
        # Check TFTP logs for upload request
        docker logs tftp-test | grep "WRQ from"
        
    - name: Cleanup test container
      if: always()
      run: |
        docker stop tftp-test || true
        docker rm tftp-test || true
        rm -f /tmp/test /tmp/upload-test.txt

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ github.repository_owner }}/tftp-server
          ghcr.io/${{ github.repository_owner }}/tftp-server
        tags: |
          type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}

    - name: Build and push to registries
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        
    # This runs last. The images are already published by the step above, so the
    # tag is a marker, not the trigger. Nothing downstream depends on it.
    - name: Create Git Tag
      env:
        TAG: ${{ steps.version.outputs.tag }}
        COMMIT: ${{ github.sha }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "$TAG" -m "Automated release $TAG from Dockerfile change in $COMMIT"
        git push origin "$TAG"

